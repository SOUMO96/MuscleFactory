<div style="font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; background: #0D0D0F; color: #FFFFFF;">
  <h1 style="font-size: 20px; letter-spacing: 2px; color: #CCFF00; margin: 0 0 24px;">MUSCLE FACTORY</h1>
  <h2 style="font-size: 18px; margin: 0 0 12px;">Your verification code</h2>
  <p style="font-size: 14px; color: #9A9AA5; margin: 0 0 24px;">
    Enter this code in the app to verify your email address.
  </p>
  <div style="background: #1E1E24; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 24px;">
    <span style="font-size: 36px; font-weight: 800; letter-spacing: 8px; color: #CCFF00;">{{ .Token }}</span>
  </div>
  <p style="font-size: 13px; color: #6B6B75; margin: 0;">
    This code expires in 1 hour. If you didn't request this, you can safely ignore this email.
  </p>
</div>
